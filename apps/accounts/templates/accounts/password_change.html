{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Change password" %} — TeamFlow{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{% translate "Change password" %}</h1></div></div>
<div class="card narrow-sm">
  <form method="post" class="form" novalidate>{% csrf_token %}{% include "partials/_form.html" %}
    <div class="form-actions"><button class="btn" type="submit">{% translate "Update password" %}</button><a class="btn secondary" href="{% url 'accounts:profile' %}">{% translate "Cancel" %}</a></div>
  </form>
</div>
{% endblock %}
