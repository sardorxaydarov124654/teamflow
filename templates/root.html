{% load static i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TeamFlow{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}TeamFlow — multi-tenant project and task management for teams.{% endblock %}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%231A6FE8'/%3E%3Cpath d='M6 15c4-4 8-4 12 0s8 4 12 0 5-3 6-2M6 22c4-4 8-4 12 0s8 4 12 0 5-3 6-2M8 29c4-4 8-4 12 0s8 4 12 0' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <script>
    /* Apply the saved theme before first paint so there is no light-mode flash. */
    (function () {
      try {
        var saved = localStorage.getItem("teamflow-theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% include "partials/_icons.html" %}
{% block body %}{% endblock %}

{% if messages %}
<div id="toast-container" role="status" aria-live="polite">
  {% for message in messages %}
    <div class="toast toast-{{ message.tags|default:'info' }}">
      <svg class="i toast-icon"><use href="#i-{% if message.tags == 'success' %}check{% elif message.tags == 'error' %}alert{% elif message.tags == 'warning' %}alert{% else %}info{% endif %}"/></svg>
      <span class="toast-text">{{ message }}</span>
      <button type="button" class="toast-close" data-toast-close aria-label="{% translate 'Close' %}">&times;</button>
    </div>
  {% endfor %}
</div>
{% endif %}

<script src="{% static 'js/app.js' %}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
