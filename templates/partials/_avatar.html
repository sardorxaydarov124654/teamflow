{% load avatar_extras %}
{# Usage: {% include "partials/_avatar.html" with person=some_user size="sm" %} (defaults to the signed-in user) #}
{% firstof person user as p %}
{% if p.avatar %}
  <img class="avatar avatar-{{ size|default:'md' }}" src="{{ p.avatar.url }}" alt="{{ p.full_name }}">
{% else %}
  <span class="avatar avatar-{{ size|default:'md' }} avatar-initials" style="background:{{ p|avatar_color }};" aria-hidden="true">{{ p|user_initials }}</span>
{% endif %}
